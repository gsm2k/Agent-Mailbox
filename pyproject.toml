[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mailbox"
version = "0.1.0"
description = "A local SQLite mailbox for coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]

[project.scripts]
agent-mailbox = "agent_mailbox.cli:main"
agent-mailbox-mcp = "agent_mailbox.mcp_bridge:main"
